[package]
name = "pxlpeep"
version = "0.1.0"
description = "pxlpeep desktop shell — hosts the shared viewer (content/main.js) in a native window"
authors = ["shaperilio"]
repository = "https://github.com/shaperilio/pxlpeep-browser"
edition = "2021"
rust-version = "1.77.2"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pxlpeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset backs `assetProtocol` in tauri.conf.json — it's what lets the webview
# load local image files via convertFileSrc(). Tauri cross-checks these and fails the
# build if the feature and the config disagree.
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
